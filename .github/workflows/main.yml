name: PanVK FristOneRR Android ARM64 Build (V36)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-panvk:
    name: Build PanVK for Android ARM64 (KBase)
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget unzip zip file build-essential \
            python3 python3-pip python3-mako python3-yaml \
            ninja-build pkg-config bison flex cmake \
            libdrm-dev libelf-dev libexpat1-dev libwayland-dev \
            libx11-dev libxext-dev libxrandr-dev libxcb1-dev libxcb-randr0-dev \
            libvulkan-dev libclang-18-dev clang-18 llvm-18-dev llvm-18-tools lld \
            libclc-18-dev libllvmspirvlib-18-dev \
            glslang-tools spirv-tools zlib1g-dev rustc cargo
          echo "Checking libdrm development headers"
          dpkg -L libdrm-dev | grep -E '/(xf86drm\.h|drm\.h)$'
          test -f /usr/include/xf86drm.h
          test -f /usr/include/libdrm/drm.h

      - name: Install Meson
        run: |
          python3 -m pip install --user --break-system-packages "meson>=1.4.0,<2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "$GITHUB_WORKSPACE/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Download FristOneRR source
        run: |
          git clone --depth 1 https://github.com/FristOneRR-Admin/FristOneRR-Panvk-Source.git mesa

      - name: Make generic Pan KMD Android-safe
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path
          p = Path("src/panfrost/lib/kmod/pan_kmod.c")
          s = p.read_text()
          s = s.replace("#include <xf86drm.h>", "#ifndef __ANDROID__\n#include <xf86drm.h>\n#endif", 1)
          start = s.index("pan_kmod_dev_create(int fd, uint32_t flags,")
          end = s.index("\nvoid\npan_kmod_dev_destroy", start)
          func = s[start:end]
          a = func.index("   drmVersionPtr version = drmGetVersion(fd);")
          b = func.index("   return dev;", a) + len("   return dev;")
          original = func[a:b]
          func = func[:a] + "#ifdef __ANDROID__\n   (void)fd; (void)flags; (void)allocator;\n   errno = ENOTSUP;\n   return NULL;\n#else\n" + original + "\n#endif" + func[b:]
          s = s[:start] + func + s[end:]
          start = s.index("   uint32_t handle;\n   int ret = drmPrimeFDToHandle", s.index("pan_kmod_bo_import"))
          end = s.index("out_unlock:", start)
          drmblock = s[start:end]
          s = s[:start] + "#ifdef __ANDROID__\n   /* Android must use the KBase bo_import_fd callback. */\n   errno = ENOTSUP;\n   goto err_unlock;\n#else\n" + drmblock + "#endif\n\n" + s[end:]
          # The close-handle cleanup is Linux/libdrm-only; the common unlock label remains visible.
          start = s.index("err_close_handle:", s.index("pan_kmod_bo_import"))
          end = s.index("err_unlock:", start)
          s = s[:start] + "#ifndef __ANDROID__\n" + s[start:end] + "#endif\n\n" + s[end:]
          p.write_text(s)
          p = Path("src/panfrost/lib/kmod/meson.build")
          s = p.read_text()
          old = "dependencies: [dep_libdrm, idep_mesautil, idep_pan_packers, libpanfrost_model_dep],"
          new = "dependencies: (host_machine.system() == 'android' ? [idep_mesautil, idep_pan_packers, libpanfrost_model_dep] : [dep_libdrm, idep_mesautil, idep_pan_packers, libpanfrost_model_dep]),"
          if old not in s: raise SystemExit("Expected libpankmod dependency list not found")
          s = s.replace(old, new, 1)
          old = "  dependencies: [dep_libdrm],"
          new = "  dependencies: (host_machine.system() == 'android' ? [] : [dep_libdrm]),"
          if old not in s: raise SystemExit("Expected libpankmod_dep DRM dependency not found")
          p.write_text(s.replace(old, new, 1))
          print("Android KBase DRM isolation patch applied")
          PYPATCH

      # PanVK needs build-machine tools during cross compilation.
      # Build those tools natively first, so the Android build does not try
      # to link Ubuntu's x86_64 LLVM libraries into an Android ARM64 binary.
      - name: Make generic Pan KMD header Android-safe
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path
          import re
          p = Path("src/panfrost/lib/kmod/pan_kmod.h")
          s = p.read_text()
          if "#include <xf86drm.h>" not in s:
              raise SystemExit("Expected xf86drm.h include not found")
          s = s.replace("#include <xf86drm.h>", "#ifndef __ANDROID__\n#include <xf86drm.h>\n#else\n#include <sys/ioctl.h>\n#include <errno.h>\n#endif", 1)
          pattern = r"#define pan_kmod_ioctl\(fd, op, arg\).*?^   \}\)"
          match = re.search(pattern, s, re.M | re.S)
          if not match:
              raise SystemExit("Expected pan_kmod_ioctl macro not found")
          old_macro = match.group(0)
          new_macro = "#ifdef __ANDROID__\n#define pan_kmod_ioctl(fd, op, arg) ioctl(fd, op, arg)\n#else\n" + old_macro + "\n#endif"
          s = s[:match.start()] + new_macro + s[match.end():]
          old = "   } else {\n      if (drmPrimeHandleToFD(bo->dev->fd, bo->handle,\n                             DRM_CLOEXEC | DRM_RDWR, &fd)) {\n         mesa_loge(\"drmPrimeHandleToFD() failed (err=%d)\", errno);\n         return -1;\n      }\n   }"
          new = "   } else {\n#ifdef __ANDROID__\n      /* Android KBase exports dma-bufs through its backend callback. */\n      errno = ENOTSUP;\n      return -1;\n#else\n      if (drmPrimeHandleToFD(bo->dev->fd, bo->handle,\n                             DRM_CLOEXEC | DRM_RDWR, &fd)) {\n         mesa_loge(\"drmPrimeHandleToFD() failed (err=%d)\", errno);\n         return -1;\n      }\n#endif\n   }"
          if old not in s:
              raise SystemExit("Expected DRM BO export fallback not found")
          s = s.replace(old, new, 1)
          p.write_text(s)
          print("Android KBase header no longer requires libdrm headers")
          PYPATCH

      - name: Make PanVK physical device DRM type Android-safe
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path
          p = Path("src/panfrost/vulkan/panvk_physical_device.h")
          s = p.read_text()
          typedef = "#ifdef __ANDROID__\ntypedef struct _drmDevice *drmDevicePtr;\n#endif\n"
          # Add a forward declaration immediately after the include guard, only once.
          guard = "#define PANVK_PHYSICAL_DEVICE_H\n"
          if "typedef struct _drmDevice *drmDevicePtr;" not in s:
              if guard not in s:
                  raise SystemExit("Header guard marker missing; refusing to patch")
              s = s.replace(guard, guard + typedef, 1)
          if "typedef struct _drmDevice *drmDevicePtr;" not in s:
              raise SystemExit("Android drmDevicePtr declaration patch verification failed")
          if r"\\n" in s:
              raise SystemExit("Detected literal escaped-newline corruption in header")
          p.write_text(s)
          print("Verified Android drmDevicePtr forward declaration")
          PYPATCH
          sed -n '1,18p' src/panfrost/vulkan/panvk_physical_device.h


      - name: Remove host-only DRM header from Pan perf
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path
          p = Path("src/panfrost/perf/pan_perf.c")
          s = p.read_text()
          old = "#include <xf86drm.h>\n"
          if old not in s:
              raise SystemExit("Expected xf86drm.h include in pan_perf.c not found")
          s = s.replace(old, "", 1)
          if "#include <xf86drm.h>" in s:
              raise SystemExit("xf86drm.h removal verification failed")
          p.write_text(s)
          print("Removed unused host-only libdrm header from pan_perf.c")
          PYPATCH


      - name: Make PanVK async bind syncobj Android-safe
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path
          import re
          p = Path("src/panfrost/vulkan/panvk_async_bind.c")
          s = p.read_text()
          pattern = r"(?m)^\s*if \(submit->force_sync\) \{.*?drmSyncobjReset\(device->drm_fd, &submit->syncobj_handle, 1\);\s*\}"
          match = re.search(pattern, s, re.S)
          if not match:
              raise SystemExit("Expected force_sync syncobj block not found; refusing patch")
          replacement = "#ifndef __ANDROID__\n" + match.group(0) + "\n#endif"
          s = s[:match.start()] + replacement + s[match.end():]
          if r"\\n" in s:
              raise SystemExit("Detected literal escaped-newline corruption; refusing patched source")
          if "#ifndef __ANDROID__" not in s or "#endif" not in s:
              raise SystemExit("Android guard verification failed")
          p.write_text(s)
          print("Guarded DRM syncobj wait/reset block for Android")
          PYPATCH

      - name: Build native PanVK shader tools
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail

          # The Android NDK also ships llvm-config (version 21). It is NOT
          # the native LLVM development package required for this host build.
          # Force Meson to use Ubuntu's native LLVM 18 instead.
          test -x /usr/bin/llvm-config-18
          sudo ln -sf /usr/bin/llvm-config-18 /usr/local/bin/llvm-config
          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
          command -v llvm-config
          llvm-config --version
          llvm-config --libdir
          llvm-config --includedir

          # Mesa 26.3 CLC requires SPIRV-Tools with PR KhronosGroup/SPIRV-Tools#5534.
          # Ubuntu's packaged SPIRV-Tools 2025.1.1 lacks that API, so build upstream
          # SPIRV-Tools and its matching SPIRV-Headers for the native build host.
          rm -rf "$RUNNER_TEMP/SPIRV-Tools"
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Tools.git "$RUNNER_TEMP/SPIRV-Tools"
          # Required API is supplied by KhronosGroup/SPIRV-Tools PR 5534;
          # it is not guaranteed to exist on the repository's default branch.
          git -C "$RUNNER_TEMP/SPIRV-Tools" fetch --depth=1 origin pull/5534/head
          git -C "$RUNNER_TEMP/SPIRV-Tools" checkout FETCH_HEAD
          # SPIRV-Tools records its matching SPIRV-Headers revision in DEPS.
          # It is a DEPS-managed dependency, not a Git submodule, so
          # `git submodule update` alone does not populate external/spirv-headers.
          SPIRV_HEADERS_REV="$(python3 - <<'PYDEPS'
          import os
          import re
          from pathlib import Path
          deps = (Path(os.environ["RUNNER_TEMP"]) / "SPIRV-Tools" / "DEPS").read_text()
          match = re.search(r"spirv_headers_revision\s*['\"]?\s*:\s*['\"]([0-9a-f]{40})['\"]", deps)
          if not match:
              raise SystemExit("Could not find pinned spirv_headers_revision in SPIRV-Tools/DEPS")
          print(match.group(1))
          PYDEPS
          )"
          test "${#SPIRV_HEADERS_REV}" -eq 40
          git clone https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/SPIRV-Tools/external/spirv-headers"
          git -C "$RUNNER_TEMP/SPIRV-Tools/external/spirv-headers" fetch --depth=1 origin "$SPIRV_HEADERS_REV"
          git -C "$RUNNER_TEMP/SPIRV-Tools/external/spirv-headers" checkout FETCH_HEAD
          test -f "$RUNNER_TEMP/SPIRV-Tools/external/spirv-headers/include/spirv/unified1/spirv.h"
          echo "Using SPIRV-Headers revision $SPIRV_HEADERS_REV"
          grep -n "SetAllowPtrTypeMismatch" "$RUNNER_TEMP/SPIRV-Tools/include/spirv-tools/linker.hpp"

          # This source adds -llog globally, but Android's liblog does not
          # exist on the Ubuntu x86_64 build host. Keep it only for Android
          # target builds; the Android cross build below will still link it.
          python3 - <<'PYLOG'
          from pathlib import Path
          meson_file = Path("meson.build")
          text = meson_file.read_text()
          old = """add_project_link_arguments(
            '-llog',
            language : ['c', 'cpp'],
          )"""
          new = """if host_machine.system() == 'android'
            add_project_link_arguments(
              '-llog',
              language : ['c', 'cpp'],
            )
          endif"""
          if old not in text:
              raise SystemExit("Expected global -llog block not found; refusing unsafe patch")
          meson_file.write_text(text.replace(old, new, 1))
          PYLOG

          # This PanVK target uses Android + Panfrost KBase, not DRM/KMS.
          # Mesa's generic platform list includes Android in system_has_kms_drm,
          # which incorrectly enables the Linux libdrm sync provider and makes
          # the Android cross compiler include Ubuntu's host-only xf86drm.h.
          # Exclude Android from that generic DRM/KMS capability for this build.
          python3 - <<'PYDRM'
          from pathlib import Path
          import re
          meson_file = Path("meson.build")
          text = meson_file.read_text()
          old = "system_has_kms_drm = ['openbsd', 'netbsd', 'freebsd', 'gnu/kfreebsd', 'dragonfly', 'linux', 'sunos', 'android', 'managarm'].contains(host_machine.system())"
          new = "system_has_kms_drm = ['openbsd', 'netbsd', 'freebsd', 'gnu/kfreebsd', 'dragonfly', 'linux', 'sunos', 'managarm'].contains(host_machine.system())"
          if old not in text:
              raise SystemExit("Expected system_has_kms_drm platform list not found; refusing unsafe patch")
          meson_file.write_text(text.replace(old, new, 1))
          PYDRM

          # Mesa's CLC feature test uses Clang-only warning flags. GCC 13
          # rejects these unknown warning options, so omit them for GCC.
          python3 - <<'PY'
          from pathlib import Path
          meson_file = Path("src/compiler/clc/meson.build")
          text = meson_file.read_text()
          old = "  args : ['-Wno-error=unguarded-availability', '-Wno-error=unguarded-availability-new'],"
          new = "  args : cpp.get_id() == 'clang' ? ['-Wno-error=unguarded-availability', '-Wno-error=unguarded-availability-new'] : [],"
          if old not in text:
              raise SystemExit("Expected CLC feature-test args not found; refusing unsafe patch")
          meson_file.write_text(text.replace(old, new, 1))
          PY

          cmake -S "$RUNNER_TEMP/SPIRV-Tools" -B "$RUNNER_TEMP/SPIRV-Tools/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSPIRV_TOOLS_BUILD_STATIC=ON \
            -DSPIRV_TOOLS_BUILD_SHARED=OFF \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_SKIP_EXECUTABLES=ON
          cmake --build "$RUNNER_TEMP/SPIRV-Tools/build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/SPIRV-Tools/build"

          # Prefer the freshly built package metadata and libraries over Ubuntu's
          # older system copy. Keep Mesa's >=2024.1 version check satisfied.
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          pkg-config --modversion SPIRV-Tools
          pkg-config --variable=libdir SPIRV-Tools

          rm -rf build-native

          meson setup build-native \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=panfrost \
            -Dpanfrost-kmds=kbase \
            -Dtools=panfrost \
            -Dmesa-clc=enabled \
            -Dprecomp-compiler=enabled \
            -Dllvm=enabled \
            -Dshared-llvm=enabled \
            -Ddraw-use-llvm=false \
            -Damd-use-llvm=false \
            -Dllvm-orcjit=false \
            -Dbuild-tests=false \
            -Dbuildtype=release \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled

          ninja -C build-native -j2

          mkdir -p "$HOME/panvk-native-tools"
          for tool in mesa_clc vtn_bindgen2 panfrost_compile; do
            found="$(find build-native -type f -name "$tool" -perm -111 -print -quit)"
            if [ -z "$found" ]; then
              echo "ERROR: native build tool not found: $tool"
              find build-native -type f -perm -111 | grep -E 'mesa_clc|vtn_bindgen2|panfrost_compile' || true
              exit 1
            fi
            cp "$found" "$HOME/panvk-native-tools/$tool"
          done
          chmod +x "$HOME/panvk-native-tools/"*
          echo "$HOME/panvk-native-tools" >> "$GITHUB_PATH"

      - name: Prepare Android cross file
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > android-cross-github.txt <<EOF
          [binaries]
          c = ['$NDK/aarch64-linux-android30-clang']
          cpp = ['$NDK/aarch64-linux-android30-clang++']
          ar = '$NDK/llvm-ar'
          strip = '$NDK/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [built-in options]
          # Never add Ubuntu host headers to the Android NDK sysroot.

          [properties]
          needs_exe_wrapper = true
          platform-sdk-version = 30
          EOF


      - name: Repair PanVK instance Android include patch
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path
          p = Path("src/panfrost/vulkan/panvk_instance.c")
          s = p.read_text()
          # Repair the malformed literal escape inserted by the previous workflow.
          malformed = r'#include <xf86drm.h>\\n#include "util/build_id.h"'
          if malformed in s:
              s = s.replace(malformed, '#include "util/build_id.h"', 1)
          # Remove any standalone host libdrm header added by this workflow.
          s = s.replace("#include <xf86drm.h>\\n", "")
          s = s.replace("#include <xf86drm.h>", "")
          if r"\\n" in s:
              raise SystemExit("Unexpected literal \\n sequence remains in panvk_instance.c")
          if '#include "util/build_id.h"' not in s:
              raise SystemExit('util/build_id.h include missing after repair; refusing to continue')
          p.write_text(s)
          print("Repaired panvk_instance.c include corruption and removed host-only libdrm include")
          PYPATCH
          sed -n '1,30p' src/panfrost/vulkan/panvk_instance.c

      - name: Fix libdrm device discovery headers for Android
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path
          p = Path("src/panfrost/vulkan/panvk_instance.c")
          s = p.read_text()
          # The previous workflow stripped xf86drm.h, leaving libdrm's
          # drmDevice structure and enumeration APIs undeclared. Restore it
          # as a normal include, not a malformed escaped string.
          if '#include <xf86drm.h>' not in s:
              anchor = '#include "util/build_id.h"'
              if anchor not in s:
                  raise SystemExit('Expected build_id include anchor missing')
              s = s.replace(anchor, anchor + '\n#include <xf86drm.h>', 1)
          if r'\\n' in s:
              raise SystemExit('Malformed escaped newline remains in panvk_instance.c')
          if s.count('#include <xf86drm.h>') != 1:
              raise SystemExit('xf86drm.h include count verification failed')
          p.write_text(s)
          print('Restored xf86drm.h declaration header')
          PYPATCH
          sed -n '1,35p' src/panfrost/vulkan/panvk_instance.c

      - name: Configure Android PanVK build
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail

          # Confirm the native tools are available to Meson.
          command -v mesa_clc
          command -v vtn_bindgen2
          command -v panfrost_compile

          meson setup build-android \
            --cross-file android-cross-github.txt \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dandroid-strict=true \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=panfrost \
            -Dpanfrost-kmds=kbase \
            -Dtools=[] \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dzstd=disabled \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Damd-use-llvm=false \
            -Dllvm-orcjit=false \
            -Dbuild-tests=false \
            -Dbuildtype=release \
            -Dopengl=false \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled

      - name: Make PanVK queue syncobj calls Android-safe
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path
          p = Path("src/panfrost/vulkan/panvk_bind_queue.c")
          s = p.read_text()
          # Guard the libdrm syncobj API calls, unavailable in the Android headers
          # used by this KBase-targeted build.
          create = "int ret = drmSyncobjCreate(dev->drm_fd, 0, &queue->syncobj_handle);"
          destroy = "drmSyncobjDestroy(dev->drm_fd, queue->syncobj_handle);"
          if create not in s or destroy not in s:
              raise SystemExit("Expected syncobj create/destroy calls not found; refusing patch")
          s = s.replace(create, "#ifndef __ANDROID__\n" + create + "\n#else\nint ret = 0;\nqueue->syncobj_handle = 0;\n#endif", 1)
          s = s.replace(destroy, "#ifndef __ANDROID__\n" + destroy + "\n#endif", 1)
          if s.count("drmSyncobjCreate(dev->drm_fd") != 1 or s.count("drmSyncobjDestroy(dev->drm_fd") != 1:
              raise SystemExit("Syncobj call patch verification failed")
          p.write_text(s)
          print("Guarded PanVK queue syncobj calls for Android")
          PYPATCH

      - name: Compile Android PanVK
        working-directory: mesa
        run: |
          set -euxo pipefail
          ninja -C build-android -j2

      - name: Locate and verify Vulkan library
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail
          DRIVER="$(find build-android -type f -name 'libvulkan_panfrost.so' -print -quit)"
          test -n "$DRIVER"
          file "$DRIVER"
          readelf -h "$DRIVER" | grep -E 'Class:|Machine:'
          mkdir -p ../PanVK-Android-ARM64
          cp "$DRIVER" ../PanVK-Android-ARM64/
          cp LICENSE ../PanVK-Android-ARM64/
          cp tools/fristonerr/build-options.txt ../PanVK-Android-ARM64/
          printf '%s\n' \
            'Experimental PanVK build for Android ARM64 / Panfrost KBase.' \
            'Not validated on Infinix X689 / Mali-G52 MC2. Keep the original driver for rollback.' \
            > ../PanVK-Android-ARM64/README-TESTING.txt

      - name: Package driver
        run: |
          set -euxo pipefail
          zip -r PanVK-FristOneRR-Android-ARM64.zip PanVK-Android-ARM64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-FristOneRR-Android-ARM64
          path: PanVK-FristOneRR-Android-ARM64.zip
          if-no-files-found: error
