name: PanVK FristOneRR Android ARM64 Build (V22)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-panvk:
    name: Build PanVK for Android ARM64 (KBase)
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget unzip zip file build-essential \
            python3 python3-pip python3-mako python3-yaml \
            ninja-build pkg-config bison flex cmake \
            libdrm-dev libelf-dev libexpat1-dev libwayland-dev \
            libx11-dev libxext-dev libxrandr-dev libxcb1-dev libxcb-randr0-dev \
            libvulkan-dev libclang-18-dev clang-18 llvm-18-dev llvm-18-tools lld \
            libclc-18-dev libllvmspirvlib-18-dev \
            glslang-tools spirv-tools zlib1g-dev rustc cargo

      - name: Install Meson
        run: |
          python3 -m pip install --user --break-system-packages "meson>=1.4.0,<2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "$GITHUB_WORKSPACE/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Download FristOneRR source
        run: |
          git clone --depth 1 https://github.com/FristOneRR-Admin/FristOneRR-Panvk-Source.git mesa

      # PanVK needs build-machine tools during cross compilation.
      # Build those tools natively first, so the Android build does not try
      # to link Ubuntu's x86_64 LLVM libraries into an Android ARM64 binary.
      - name: Build native PanVK shader tools
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail

          # The Android NDK also ships llvm-config (version 21). It is NOT
          # the native LLVM development package required for this host build.
          # Force Meson to use Ubuntu's native LLVM 18 instead.
          test -x /usr/bin/llvm-config-18
          sudo ln -sf /usr/bin/llvm-config-18 /usr/local/bin/llvm-config
          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
          command -v llvm-config
          llvm-config --version
          llvm-config --libdir
          llvm-config --includedir

          # Mesa 26.3 CLC requires SPIRV-Tools with PR KhronosGroup/SPIRV-Tools#5534.
          # Ubuntu's packaged SPIRV-Tools 2025.1.1 lacks that API, so build upstream
          # SPIRV-Tools and its matching SPIRV-Headers for the native build host.
          rm -rf "$RUNNER_TEMP/SPIRV-Tools"
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Tools.git "$RUNNER_TEMP/SPIRV-Tools"
          # Required API is supplied by KhronosGroup/SPIRV-Tools PR 5534;
          # it is not guaranteed to exist on the repository's default branch.
          git -C "$RUNNER_TEMP/SPIRV-Tools" fetch --depth=1 origin pull/5534/head
          git -C "$RUNNER_TEMP/SPIRV-Tools" checkout FETCH_HEAD
          # SPIRV-Tools records its matching SPIRV-Headers revision in DEPS.
          # It is a DEPS-managed dependency, not a Git submodule, so
          # `git submodule update` alone does not populate external/spirv-headers.
          SPIRV_HEADERS_REV="$(python3 - <<'PYDEPS'
          import os
          import re
          from pathlib import Path
          deps = (Path(os.environ["RUNNER_TEMP"]) / "SPIRV-Tools" / "DEPS").read_text()
          match = re.search(r"spirv_headers_revision\s*['\"]?\s*:\s*['\"]([0-9a-f]{40})['\"]", deps)
          if not match:
              raise SystemExit("Could not find pinned spirv_headers_revision in SPIRV-Tools/DEPS")
          print(match.group(1))
          PYDEPS
          )"
          test "${#SPIRV_HEADERS_REV}" -eq 40
          git clone https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/SPIRV-Tools/external/spirv-headers"
          git -C "$RUNNER_TEMP/SPIRV-Tools/external/spirv-headers" fetch --depth=1 origin "$SPIRV_HEADERS_REV"
          git -C "$RUNNER_TEMP/SPIRV-Tools/external/spirv-headers" checkout FETCH_HEAD
          test -f "$RUNNER_TEMP/SPIRV-Tools/external/spirv-headers/include/spirv/unified1/spirv.h"
          echo "Using SPIRV-Headers revision $SPIRV_HEADERS_REV"
          grep -n "SetAllowPtrTypeMismatch" "$RUNNER_TEMP/SPIRV-Tools/include/spirv-tools/linker.hpp"

          # This source adds -llog globally, but Android's liblog does not
          # exist on the Ubuntu x86_64 build host. Keep it only for Android
          # target builds; the Android cross build below will still link it.
          python3 - <<'PYLOG'
          from pathlib import Path
          meson_file = Path("meson.build")
          text = meson_file.read_text()
          old = """add_project_link_arguments(
            '-llog',
            language : ['c', 'cpp'],
          )"""
          new = """if host_machine.system() == 'android'
            add_project_link_arguments(
              '-llog',
              language : ['c', 'cpp'],
            )
          endif"""
          if old not in text:
              raise SystemExit("Expected global -llog block not found; refusing unsafe patch")
          meson_file.write_text(text.replace(old, new, 1))
          PYLOG

          # This PanVK target uses Android + Panfrost KBase, not DRM/KMS.
          # Mesa's generic platform list includes Android in system_has_kms_drm,
          # which incorrectly enables the Linux libdrm sync provider and makes
          # the Android cross compiler include Ubuntu's host-only xf86drm.h.
          # Exclude Android from that generic DRM/KMS capability for this build.
          python3 - <<'PYDRM'
          from pathlib import Path
          import re
          meson_file = Path("meson.build")
          text = meson_file.read_text()
          old = "system_has_kms_drm = ['openbsd', 'netbsd', 'freebsd', 'gnu/kfreebsd', 'dragonfly', 'linux', 'sunos', 'android', 'managarm'].contains(host_machine.system())"
          new = "system_has_kms_drm = ['openbsd', 'netbsd', 'freebsd', 'gnu/kfreebsd', 'dragonfly', 'linux', 'sunos', 'managarm'].contains(host_machine.system())"
          if old not in text:
              raise SystemExit("Expected system_has_kms_drm platform list not found; refusing unsafe patch")
          meson_file.write_text(text.replace(old, new, 1))
          PYDRM

          # Mesa's CLC feature test uses Clang-only warning flags. GCC 13
          # rejects these unknown warning options, so omit them for GCC.
          python3 - <<'PY'
          from pathlib import Path
          meson_file = Path("src/compiler/clc/meson.build")
          text = meson_file.read_text()
          old = "  args : ['-Wno-error=unguarded-availability', '-Wno-error=unguarded-availability-new'],"
          new = "  args : cpp.get_id() == 'clang' ? ['-Wno-error=unguarded-availability', '-Wno-error=unguarded-availability-new'] : [],"
          if old not in text:
              raise SystemExit("Expected CLC feature-test args not found; refusing unsafe patch")
          meson_file.write_text(text.replace(old, new, 1))
          PY

          cmake -S "$RUNNER_TEMP/SPIRV-Tools" -B "$RUNNER_TEMP/SPIRV-Tools/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSPIRV_TOOLS_BUILD_STATIC=ON \
            -DSPIRV_TOOLS_BUILD_SHARED=OFF \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_SKIP_EXECUTABLES=ON
          cmake --build "$RUNNER_TEMP/SPIRV-Tools/build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/SPIRV-Tools/build"

          # Prefer the freshly built package metadata and libraries over Ubuntu's
          # older system copy. Keep Mesa's >=2024.1 version check satisfied.
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          pkg-config --modversion SPIRV-Tools
          pkg-config --variable=libdir SPIRV-Tools

          rm -rf build-native

          meson setup build-native \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=panfrost \
            -Dpanfrost-kmds=kbase \
            -Dtools=panfrost \
            -Dmesa-clc=enabled \
            -Dprecomp-compiler=enabled \
            -Dllvm=enabled \
            -Dshared-llvm=enabled \
            -Ddraw-use-llvm=false \
            -Damd-use-llvm=false \
            -Dllvm-orcjit=false \
            -Dbuild-tests=false \
            -Dbuildtype=release \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled

          ninja -C build-native -j2

          mkdir -p "$HOME/panvk-native-tools"
          for tool in mesa_clc vtn_bindgen2 panfrost_compile; do
            found="$(find build-native -type f -name "$tool" -perm -111 -print -quit)"
            if [ -z "$found" ]; then
              echo "ERROR: native build tool not found: $tool"
              find build-native -type f -perm -111 | grep -E 'mesa_clc|vtn_bindgen2|panfrost_compile' || true
              exit 1
            fi
            cp "$found" "$HOME/panvk-native-tools/$tool"
          done
          chmod +x "$HOME/panvk-native-tools/"*
          echo "$HOME/panvk-native-tools" >> "$GITHUB_PATH"

      - name: Prepare Android cross file
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > android-cross-github.txt <<EOF
          [binaries]
          c = ['$NDK/aarch64-linux-android30-clang']
          cpp = ['$NDK/aarch64-linux-android30-clang++']
          ar = '$NDK/llvm-ar'
          strip = '$NDK/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          platform-sdk-version = 30
          EOF

      - name: Configure Android PanVK build
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail

          # Confirm the native tools are available to Meson.
          command -v mesa_clc
          command -v vtn_bindgen2
          command -v panfrost_compile

          meson setup build-android \
            --cross-file android-cross-github.txt \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dandroid-strict=true \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=panfrost \
            -Dpanfrost-kmds=kbase \
            -Dtools=[] \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dzstd=disabled \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Damd-use-llvm=false \
            -Dllvm-orcjit=false \
            -Dbuild-tests=false \
            -Dbuildtype=release \
            -Dopengl=false \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled

      - name: Compile Android PanVK
        working-directory: mesa
        run: |
          set -euxo pipefail
          ninja -C build-android -j2

      - name: Locate and verify Vulkan library
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail
          DRIVER="$(find build-android -type f -name 'libvulkan_panfrost.so' -print -quit)"
          test -n "$DRIVER"
          file "$DRIVER"
          readelf -h "$DRIVER" | grep -E 'Class:|Machine:'
          mkdir -p ../PanVK-Android-ARM64
          cp "$DRIVER" ../PanVK-Android-ARM64/
          cp LICENSE ../PanVK-Android-ARM64/
          cp tools/fristonerr/build-options.txt ../PanVK-Android-ARM64/
          printf '%s\n' \
            'Experimental PanVK build for Android ARM64 / Panfrost KBase.' \
            'Not validated on Infinix X689 / Mali-G52 MC2. Keep the original driver for rollback.' \
            > ../PanVK-Android-ARM64/README-TESTING.txt

      - name: Package driver
        run: |
          set -euxo pipefail
          zip -r PanVK-FristOneRR-Android-ARM64.zip PanVK-Android-ARM64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-FristOneRR-Android-ARM64
          path: PanVK-FristOneRR-Android-ARM64.zip
          if-no-files-found: error
