name: PanVK FristOneRR Android ARM64 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-panvk:
    name: Build PanVK Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget unzip zip file \
            build-essential python3 python3-pip python3-mako python3-yaml \
            ninja-build pkg-config bison flex cmake \
            libdrm-dev libelf-dev libexpat1-dev libwayland-dev \
            libx11-dev libxext-dev libxrandr-dev libxcb1-dev \
            libvulkan-dev libclang-18-dev clang-18 llvm-18-dev llvm-18-tools lld \
            glslang-tools spirv-tools zlib1g-dev rustc cargo \
            libclc-18-dev

      - name: Install Meson
        run: |
          python3 -m pip install --user --break-system-packages "meson>=1.4.0,<2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          # Keep Android NDK tools available, but force Meson to use Ubuntu's
          # native LLVM 18 config tool rather than the NDK's llvm-config.
          mkdir -p "$HOME/native-llvm-bin"
          printf '#!/usr/bin/env bash\\nexec /usr/bin/llvm-config-18 "$@"\\n' > "$HOME/native-llvm-bin/llvm-config"
          chmod +x "$HOME/native-llvm-bin/llvm-config"
          echo "$HOME/native-llvm-bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Download FristOneRR source
        run: |
          git clone --depth 1 https://github.com/FristOneRR-Admin/FristOneRR-Panvk-Source.git mesa

      - name: Prepare Android cross file
        working-directory: mesa
        run: |
          NDK="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > android-cross-github.txt <<EOF
          [binaries]
          c = ['$NDK/aarch64-linux-android30-clang', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
          cpp = ['$NDK/aarch64-linux-android30-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++']
          ar = '$NDK/llvm-ar'
          strip = '$NDK/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          platform-sdk-version = '30'
          EOF

      - name: Configure Android build
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail

          pkg-config --modversion libclc || {
            echo "libclc pkg-config metadata is missing; inspect installed libclc packages."
            find /usr -iname '*libclc*.pc' -o -iname '*clc*.pc' 2>/dev/null | head -50
            exit 1
          }

          test -x "$HOME/native-llvm-bin/llvm-config"
          test "$("$HOME/native-llvm-bin/llvm-config" --version | cut -d. -f1)" = "18"
          "$HOME/native-llvm-bin/llvm-config" --version
          "$HOME/native-llvm-bin/llvm-config" --libdir
          "$HOME/native-llvm-bin/llvm-config" --includedir

          python3 - <<'PY'
          import shlex
          from pathlib import Path

          raw = Path("tools/fristonerr/build-options.txt").read_text()
          args = shlex.split(raw)
          # Drop source preset entries for unrelated Windows, AMD, Intel,
          # Freedreno, and x86-only build targets. Keep the Panfrost kbase
          # target and the Android platform settings.
          irrelevant_prefixes = (
              "-Dmesa-clc=",
              "-Dprecomp-compiler=",
              "-Dplatform-sdk-version=",
              "-Dsplit-debug=",
              "-Damd-use-llvm=",
              "-Dintel-elk=",
              "-Dsse2=",
              "-Dfreedreno-kmds=",
              "-Dgallium-wgl-dll-name=",
              "-Dgallium-d3d10-dll-name=",
              "-Dmediafoundation-",
              "-Dgallium-mediafoundation-",
              "-Dgallium-d3d10umd=",
              "-Dmin-windows-version=",
              "-Dradv-",
              "-Dbuild-radv-",
              "-Dbuild-aco-",
              "-Dinstall-intel-",
          )
          filtered = [
              arg for arg in args
              if not arg.startswith(irrelevant_prefixes)
          ]
          Path("meson-options.txt").write_text("\n".join(filtered))
          PY

          mapfile -t MESON_OPTIONS < meson-options.txt
          meson setup build-android \
            --cross-file android-cross-github.txt \
            "${MESON_OPTIONS[@]}" \
            -Dplatform-sdk-version=30 \
            -Ddraw-use-llvm=false \
            -Dmesa-clc=auto \
            -Dprecomp-compiler=auto

      - name: Compile PanVK
        working-directory: mesa
        run: |
          ninja -C build-android -j2

      - name: Locate and verify Vulkan library
        working-directory: mesa
        shell: bash
        run: |
          set -euxo pipefail
          DRIVER="$(find build-android -type f -name 'libvulkan_panfrost.so' -print -quit)"
          test -n "$DRIVER"
          file "$DRIVER"
          readelf -h "$DRIVER" | grep -E 'Class:|Machine:'
          mkdir -p ../PanVK-Android-ARM64
          cp "$DRIVER" ../PanVK-Android-ARM64/
          cp LICENSE ../PanVK-Android-ARM64/
          cp tools/fristonerr/build-options.txt ../PanVK-Android-ARM64/
          printf '%s\n' 'Experimental build. Not validated on Infinix X689 / Mali-G52 MC2. Keep original driver for rollback.' > ../PanVK-Android-ARM64/README-TESTING.txt

      - name: Package driver
        run: |
          zip -r PanVK-FristOneRR-Android-ARM64.zip PanVK-Android-ARM64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-FristOneRR-Android-ARM64
          path: PanVK-FristOneRR-Android-ARM64.zip
          if-no-files-found: error
